<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#061a33">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>knots.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una pantalla d'app, vistes apilades (menú, nivells, joc, configuració, com jugar, editor); tauler quadrat centrat */
:root {
  --abyss: #061a33;
  --deep: #0b2a55;
  --sea: #1559a8;
  --sky: #3fa3ff;
  --ice: #bfe3ff;
  --foam: #eef7ff;
  --knot: #ff9a62;
  --ok: #7ef0c4;
  --rope-a: #8fd3ff;
  --rope-b: #c9a3ff;
  --frost: #d9f1ff;
  --mover: #c9a3ff;
  --counter: #7ef0c4;
  --stone: #4e6481;
  --stone-edge: #9fb3cf;
  --leash: #f2c94c;
  --magnet: #ff6b81;
  --swap: #7df9ff;
  --vhard: #ff5c7a;
  --line: rgba(191, 227, 255, 0.16);
  --display: "Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--abyss);
  background-image: radial-gradient(120% 70% at 50% 0%, var(--deep) 0%, var(--abyss) 70%);
  color: var(--foam);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.screen[hidden] { display: none !important; }

/* ---------- Botons ---------- */
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 18px 22px; border-radius: 18px;
  background: var(--deep); border: 1px solid var(--line);
  font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em;
  transition: transform .12s ease, background .2s ease, border-color .2s ease;
}
.btn:hover { border-color: var(--sky); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--sky); color: var(--abyss); border-color: var(--sky); font-size: 1.25rem; padding: 22px 24px; box-shadow: 0 10px 30px -10px var(--sky); }
.btn.primary:hover { background: var(--ice); border-color: var(--ice); }
.btn .arrow { font-family: var(--body); font-weight: 600; opacity: .7; }
a.btn { text-decoration: none; color: inherit; box-sizing: border-box; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: grid; place-items: center;
  background: var(--deep); border: 1px solid var(--line);
}
.icon-btn:hover { border-color: var(--sky); }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--foam); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Comptadors ---------- */
.counters { display: flex; gap: 8px; justify-content: flex-end; flex: none; }
.cnt {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border-radius: 99px; background: var(--deep); border: 1px solid var(--line);
  font-family: var(--display); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums;
}
.cnt .st { color: var(--sky); font-size: 1rem; }
.cnt svg { width: 17px; height: 17px; }
.cnt.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.18); border-color: var(--sky); } }

/* ---------- Menú principal ---------- */
.hero { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
.hero svg { flex: 0 1 auto; min-height: 0; height: min(200px, 22dvh); width: auto; max-width: 100%; aspect-ratio: 1; overflow: visible; }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 12vw, 3.8rem); letter-spacing: -0.05em; flex: none; margin: 0; line-height: 1; color: var(--foam); }
.logo span { color: var(--sky); }
.tagline { margin: 4px 0 0; color: var(--ice); opacity: .75; font-size: .9rem; text-align: center; text-wrap: balance; flex: none; }
.menu { display: flex; flex-direction: column; gap: 10px; flex: none; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu-row .btn { justify-content: center; font-size: .95rem; text-align: center; }
.foot { text-align: center; font-size: .8rem; color: var(--ice); opacity: .5; margin: 0; }

/* ---------- Capçalera de pantalla ---------- */
.bar { display: flex; align-items: center; gap: 12px; }
.bar h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.3rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#gameTitle { font-size: 1.12rem; }
@media (max-width: 380px) { #gameStreak { display: none !important; } }

/* ---------- Selecció de nivell ---------- */
.scroll { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.lv-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.lv-prog { display: flex; flex-direction: column; gap: 8px; }
.lv-prog .row { display: flex; justify-content: space-between; font-size: .82rem; color: var(--ice); font-variant-numeric: tabular-nums; }
.lv-prog .row b { color: var(--foam); }
.lv-stage { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.lv-stage .icon-btn:disabled { opacity: .25; cursor: default; }
.lv-card { background: linear-gradient(170deg, var(--sea), var(--deep) 55%); border: 1px solid rgba(63,163,255,.45); border-radius: 28px; padding: 18px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.lv-card.in-l { animation: lvin-l .28s ease; }
.lv-card.in-r { animation: lvin-r .28s ease; }
@keyframes lvin-l { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvin-r { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.lv-card .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); opacity: .75; }
.lv-card .big { font-family: var(--display); font-weight: 800; font-size: 3.6rem; line-height: .9; letter-spacing: -0.04em; }
.lv-card .pv { width: min(100%, 230px, 28dvh); height: auto; aspect-ratio: 1; max-width: 100%; border-radius: 20px; background: var(--abyss); border: 1px solid var(--line); display: block; }
.lv-card .stars { font-size: 1.6rem; letter-spacing: 4px; color: var(--sky); line-height: 1; }
.lv-card .stars .off { color: var(--line); }
.lv-card .meta { font-size: .85rem; color: var(--ice); opacity: .8; }
.lv-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.lv-tags span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--abyss); border: 1px solid var(--line); font-size: .76rem; font-weight: 600; }
.lv-tags span i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.lv-tags span.new { border-color: var(--sky); color: var(--sky); }
.lv-card .btn { justify-content: center; margin-top: 4px; }
.lv-card.locked .pv { filter: blur(6px) saturate(.4); opacity: .6; }
.lv-card .lockmsg { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ice); padding: 14px 0 4px; }
.lv-card .lockmsg svg { width: 18px; height: 18px; stroke: var(--ice); fill: none; stroke-width: 2.2; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.lvl {
  aspect-ratio: 1; max-width: 100%; border-radius: 18px;
  background: var(--deep); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  position: relative; padding: 6px;
}
.lvl:hover:not(:disabled) { border-color: var(--sky); }
.lvl .num { font-family: var(--display); font-weight: 800; font-size: 1.8rem; line-height: 1; }
.lvl .meta { font-size: .7rem; color: var(--ice); opacity: .7; text-align: center; }
.lvl .stars { font-size: .85rem; letter-spacing: 2px; color: var(--sky); }
.lvl .stars .off { color: var(--line); }
.lvl .tags { position: absolute; top: 8px; right: 8px; display: flex; gap: 3px; }
.lvl .tags i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.lvl .new { position: absolute; top: 6px; left: 8px; font-size: .62rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--abyss); background: var(--sky); padding: 2px 6px; border-radius: 99px; }
.lvl:disabled { opacity: .4; cursor: not-allowed; }
.lvl.done { background: linear-gradient(160deg, var(--sea), var(--deep)); }
.levels-note { margin: 0; color: var(--ice); opacity: .7; font-size: .9rem; }

/* ---------- Joc ---------- */
.hud { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--deep); border: 1px solid var(--line); border-radius: 14px; padding: 9px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
.stat .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ice); opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: .7em; opacity: .55; }
.stat.warn .v { color: var(--knot); }
.stat.good .v { color: var(--ok); }
.stat.low { border-color: var(--knot); }
.stat.low .v { color: var(--knot); }
.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board {
  width: min(100%, calc(100dvh - 330px)); max-width: 100%;
  aspect-ratio: 1; border-radius: 24px;
  background:
    radial-gradient(circle at 50% 50%, rgba(63,163,255,.08), transparent 70%),
    var(--deep);
  border: 1px solid var(--line);
  touch-action: none; user-select: none; -webkit-user-select: none;
  display: block;
}
.board .edge { stroke: var(--rope, var(--ice)); stroke-width: 7; stroke-linecap: round; transition: stroke .15s ease, opacity .3s ease; fill: none; }
.board .edge.cross { stroke: var(--knot); }
.board.no-hl .edge.cross { stroke: var(--rope, var(--ice)); }
.board.solved .edge { stroke: var(--ok); }
.board .edge.short { stroke-width: 15; stroke-dasharray: 0.1 19; }
.board .core { stroke: var(--rope, var(--ice)); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.board .edge.taut { stroke: var(--foam); }
.board .glow { stroke: var(--knot); stroke-width: 20; stroke-linecap: round; opacity: 0; transition: opacity .15s ease; }
.board.colored .glow.cross { opacity: .5; }
.board.no-hl .glow.cross { opacity: 0; }
.board .ehit { stroke: transparent; stroke-width: 46; stroke-linecap: round; pointer-events: none; }
.board.mode-cut .ehit { pointer-events: stroke; cursor: pointer; }
.board.mode-cut .edge:not(.short) { stroke-dasharray: 18 12; }
.board .gone { opacity: 0 !important; }
.board .tether { stroke: var(--foam); stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; opacity: .55; }
.board .node { fill: var(--nodec, var(--sky)); stroke: var(--ring, var(--foam)); stroke-width: 5; cursor: grab; }
.board .node.drag { fill: var(--foam); stroke: var(--sky); cursor: grabbing; }
.board .hit { fill: transparent; cursor: grab; }
.board.mode-bomb .hit, .board.mode-bomb .node { cursor: crosshair; }
.board.mode-bomb .node { stroke: var(--knot); }
.board .twin-dot { fill: var(--abyss); pointer-events: none; }
.board .fixed .node { fill: var(--abyss); stroke: var(--ice); cursor: not-allowed; }
.board .fixed .hit { cursor: not-allowed; }
.board .lock, .board .flake { fill: none; stroke: var(--ice); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.board .lock rect { fill: var(--ice); stroke: none; }
.board .ice .node { fill: var(--frost); stroke: var(--sky); }
.board .ice .flake { stroke: var(--sea); }
.board .frozen .node { fill: var(--abyss); stroke: var(--rope-a); cursor: not-allowed; }
.board .frozen .flake { stroke: var(--rope-a); }
.board .shake { animation: shake .3s ease; }
.board .dead { display: none; }
.board .zone { fill: url(#hatch); stroke: var(--knot); stroke-width: 3; stroke-dasharray: 8 7; opacity: .8; transition: opacity .15s; }
.board .zone.hot { opacity: 1; stroke-width: 5; }
.board .burst { fill: none; stroke: var(--knot); stroke-width: 8; animation: burst .5s ease-out forwards; pointer-events: none; }
@keyframes burst { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(2.2); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tools .undo { grid-column: 1 / -1; }
.tool {
  display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0;
  padding: 10px 6px; border-radius: 14px; background: var(--deep); border: 1px solid var(--line);
  font-weight: 700; font-size: .85rem;
}
.tool > svg { width: 18px; height: 18px; stroke: var(--foam); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tool .cost { display: inline-flex; align-items: center; gap: 3px; font-family: var(--display); font-size: .78rem; opacity: .85; white-space: nowrap; }
.tool { white-space: nowrap; }
.tool .cost svg { width: 12px; height: 12px; }
.tool:hover { border-color: var(--sky); }
.tool[aria-pressed="true"] { background: var(--knot); border-color: var(--knot); color: var(--abyss); }
.tool[aria-pressed="true"] > svg { stroke: var(--abyss); }
.tool.poor { opacity: .45; }
.hint { margin: 0; text-align: center; font-size: .85rem; color: var(--ice); opacity: .65; min-height: 1.3em; }
.hint.flash, .hint.mode { color: var(--knot); opacity: 1; font-weight: 600; }

/* ---------- Finestres ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(6, 26, 51, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.dialog {
  width: min(100%, 380px); box-sizing: border-box;
  background: var(--deep); border: 1px solid var(--sky); border-radius: 26px;
  padding: 26px 22px 20px; display: flex; flex-direction: column; gap: 12px; text-align: center;
  animation: pop .35s cubic-bezier(.2,1.4,.4,1);
}
.dialog.lost { border-color: var(--knot); }
.dialog h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.55rem; text-wrap: balance; }
.dialog p { margin: 0; color: var(--ice); line-height: 1.45; }
.dialog .extra { color: var(--sky); font-weight: 600; }
.reward { display: inline-flex; align-self: center; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 99px; background: var(--abyss); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; }
.reward svg { width: 18px; height: 18px; }
.big-stars { font-size: 2.6rem; letter-spacing: 6px; color: var(--sky); line-height: 1; }
.big-stars .off { color: var(--line); }
.dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.dialog .btn { justify-content: center; padding: 14px; font-size: .95rem; }
.dialog .btn.buy { gap: 10px; }
.dialog .btn.buy svg { width: 18px; height: 18px; }
.tut .eyebrow { align-self: center; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: var(--sky); color: var(--abyss); padding: 3px 10px; border-radius: 99px; }
.tut .pic { display: block; margin: 0 auto; width: 150px; height: 150px; border-radius: 22px; background: var(--abyss); border: 1px solid var(--line); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Configuració ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.setting {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
}
.setting.col { flex-direction: column; align-items: stretch; gap: 12px; }
.setting .txt { min-width: 0; }
.setting .t { font-weight: 600; }
.setting .d { font-size: .85rem; color: var(--ice); opacity: .7; margin-top: 2px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 99px; background: var(--abyss); border: 1px solid var(--line); transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ice); transition: transform .2s; }
.switch input:checked + .track { background: var(--sky); border-color: var(--sky); }
.switch input:checked + .track::after { transform: translateX(22px); background: var(--abyss); }
.switch input:focus-visible + .track { outline: 3px solid var(--sky); outline-offset: 3px; }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lang {
  padding: 11px 6px; border-radius: 12px; background: var(--abyss); border: 1px solid var(--line);
  font-weight: 600; font-size: .9rem; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.lang .code { font-family: var(--display); font-size: .7rem; letter-spacing: .08em; opacity: .6; }
.lang[aria-pressed="true"] { background: var(--sky); color: var(--abyss); border-color: var(--sky); }
.lang[aria-pressed="true"] .code { opacity: .8; }
.danger { color: var(--knot); border-color: rgba(255,154,98,.35); justify-content: center; font-size: .95rem; }
.confirm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.confirm .btn { justify-content: center; font-size: .9rem; padding: 14px; }

/* ---------- Com jugar ---------- */
.step { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.step svg { width: 88px; height: 88px; display: block; }
.step h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 1rem; }
.step p { margin: 0; color: var(--ice); opacity: .85; font-size: .92rem; line-height: 1.45; }
.help-sub { margin: 8px 0 0; font-family: var(--display); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.mini .e { stroke: var(--ice); stroke-width: 4; stroke-linecap: round; }
.mini .e.x { stroke: var(--knot); }
.mini .e.g { stroke: var(--ok); }
.mini .n { fill: var(--sky); stroke: var(--foam); stroke-width: 3; }
.mini .ghost { fill: none; stroke: var(--sky); stroke-width: 2; stroke-dasharray: 4 4; }

/* ---------- Editor de nivells ---------- */
.ed-note { margin: 0; font-size: .85rem; color: var(--ice); opacity: .75; line-height: 1.45; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.chip { height: 40px; border-radius: 10px; background: var(--abyss); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: .85rem; position: relative; }
.chip[aria-pressed="true"] { background: var(--sky); color: var(--abyss); border-color: var(--sky); }
.chip.mod::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--knot); }
.ed-card { background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ed-head { display: flex; gap: 14px; align-items: center; }
.ed-head svg { width: 92px; height: 92px; flex: none; border-radius: 14px; background: var(--abyss); border: 1px solid var(--line); }
.ed-head h3 { margin: 0; font-family: var(--display); font-size: 1.1rem; }
.ed-head .info { font-size: .82rem; color: var(--ice); opacity: .75; margin-top: 4px; line-height: 1.4; }
.ed-group { margin: 6px 0 -4px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.stepper .lab { min-width: 0; }
.stepper .lab b { display: block; font-weight: 600; }
.stepper .lab small { color: var(--ice); opacity: .65; font-size: .78rem; }

    edgeEls = lv.edges.map((_, k) => {
      const g = mk("g", null, ge);
      const glow = mk("path", { class: "glow" }, g);
      const isShort = lv.shortLen[k] != null;
      const core = isShort ? mk("path", { class: "core" }, g) : null;
      const vis = mk("path", { class: "edge" + (isShort ? " short" : "") }, g);
      vis.style.strokeWidth = isShort ? ew * 2 + 1 : ew;
      glow.style.strokeWidth = ew * 2.6;
      if (lv.colorOf) { vis.style.stroke = ROPE[lv.colorOf[k]]; if (core) core.style.stroke = ROPE[lv.colorOf[k]]; }

      hit.addEventListener("pointerdown", (e) => { if (mode === "cut") { e.preventDefault(); e.stopPropagation(); cutEdge(k); } });
      return { glow, core, vis, hit };
    });

    const r = n > 14 ? 23 : n > 9 ? 26 : 30;
    nodeR = r;
    sp = lv.edges.map(([a, b]) => ({ x: (pos[a][0] + pos[b][0]) / 2, y: (pos[a][1] + pos[b][1]) / 2, vx: 0, vy: 0 }));

      let deco = null;

        deco = mk("g", { class: "lock" }, inner);
        deco.innerHTML = '<path d="M-7 -1v-6a7 7 0 0 1 14 0v6"/><rect x="-10" y="-2" width="20" height="14" rx="3"/>';
        deco._s = (r + 4) / 30; deco._dy = -2;
      } else if (role === "count" || role === "swap") {
        inner.setAttribute("class", role);
        deco = mk("text", { class: "num" }, inner);
        deco.style.fontSize = Math.round(r * (role === "swap" ? 0.95 : 1.05)) + "px";
        deco._txt = true;
      } else if (role === "magnet") {
        inner.setAttribute("class", "magnet");
        deco = mk("path", { class: "magicon", d: "M-8 -9v9a8 8 0 0 0 16 0v-9" }, inner);
        deco._s = r / 30; deco._dy = 0;
      } else if (role === "leash") {
        inner.setAttribute("class", "leash");
      } else if (role === "mover") {

        deco._s = r / 30; deco._dy = 0;

      return { g, inner, c, hit, deco };
    });

    applySettings();
    go("s-game");
    setMode(null);
    prevCross = draw(); combo = 0; lastNode = null;
    runMovers();
    queueTutorials();
    if (i === 0 && !save.stars[0]) setTimeout(() => { if (cur === 0 && !over && moves === 0) startHand(); }, 700);
  }

  function draw() {
    if (!lv) return 0;
    const { count, bad, rockHit } = crossAll(lv, pos, edgeOn);
    rockEls.forEach((el, q) => el.classList.toggle("hit", !!rockHit[q] && save.highlight));
    lv.edges.forEach(([a, b], k) => {
      const E = edgeEls[k];
      const x1 = pos[a][0] * 1000, y1 = pos[a][1] * 1000, x2 = pos[b][0] * 1000, y2 = pos[b][1] * 1000;
      E.hit.setAttribute("x1", x1); E.hit.setAttribute("y1", y1); E.hit.setAttribute("x2", x2); E.hit.setAttribute("y2", y2);
      renderEdge(k);

      E.hit.style.display = gone ? "none" : "";
      E.vis.classList.toggle("cross", bad[k]);
      E.glow.classList.toggle("cross", bad[k]);
      const L = lv.shortLen[k];
      E.vis.classList.toggle("taut", !gone && L != null && !bad[k] && dist(pos[a], pos[b]) >= L * 0.97);
    });
    lv.twins.forEach(([a, b], q) => {
      const l = tetherEls[q];
      l.setAttribute("x1", pos[a][0] * 1000); l.setAttribute("y1", pos[a][1] * 1000);
      l.setAttribute("x2", pos[b][0] * 1000); l.setAttribute("y2", pos[b][1] * 1000);
      l.style.display = alive[a] && alive[b] ? "" : "none";
    });
    nodeEls.forEach((N, k) => {

      N.c.setAttribute("cx", x); N.c.setAttribute("cy", y);

    lv.leash.forEach((h, q) => {

      l.setAttribute("x2", pos[h.k][0] * 1000); l.setAttribute("y2", pos[h.k][1] * 1000);
      l.style.display = alive[h.k] ? "" : "none";
      stakeEls[q].ring.style.display = alive[h.k] ? "" : "none";
    });
    if (swapLine) {
      const { a, b } = lv.swap;
      swapLine.setAttribute("x1", pos[a][0] * 1000); swapLine.setAttribute("y1", pos[a][1] * 1000);
      swapLine.setAttribute("x2", pos[b][0] * 1000); swapLine.setAttribute("y2", pos[b][1] * 1000);
      swapLine.style.display = alive[a] && alive[b] ? "" : "none";
    }
    if (magRing) { const m = lv.magnets[0]; magRing.setAttribute("cx", pos[m][0] * 1000); magRing.setAttribute("cy", pos[m][1] * 1000); }
    $("toolUndo").disabled = !history.length || over;
    $("vCross").textContent = count;
    $("statCross").className = "stat " + (count === 0 ? "good" : "warn");
    $("vMoves").innerHTML = moves + "<small> / " + maxMoves + "</small>";
    $("statMoves").className = "stat" + (maxMoves - moves <= 2 ? " low" : "");
    return count;
  }

  let flashTimer = null;
  function updateHint() {
    if (!lv) return;
    $("gameTitle").innerHTML = (cur === DAILY ? t("daily") : t("levelN", { n: cur + 1 })) + (lv.diff ? '<span class="diff d' + lv.diff + '">' + t("diff" + lv.diff) + "</span>" : "");
    if (flashTimer) return;
    const h = $("parHint");
    h.className = "hint" + (mode ? " mode" : "");
    h.textContent = mode === "cut" ? t("cutHint") : mode === "bomb" ? t("bombHint") : handOn ? t("dragHint") : t("goal", { p: lv.par });
  }
  function flash(msg) {
    const h = $("parHint");
    clearTimeout(flashTimer);

    flashTimer = setTimeout(() => { flashTimer = null; updateHint(); }, 1700);
  }

  function toBoard(e) {
    const pt = board.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(board.getScreenCTM().inverse());
    return [p.x / 1000, p.y / 1000];
  }
  function shakeNode(k) {
    const g = nodeEls[k].inner;
    g.classList.remove("shake"); void g.getBBox(); g.classList.add("shake");
    sfx.locked();
  }
  function onDown(e, k) {
    if (over || busy || !alive[k]) return;
    e.preventDefault();
    if (mode === "bomb") { explode(k); return; }
    if (mode) return;
    if (lv.role[k] === "fixed" || lv.role[k] === "mover" || frozen[k]) { shakeNode(k); return; }
    const p = toBoard(e);
    const partner = lv.twinOf[k] >= 0 && alive[lv.twinOf[k]] ? lv.twinOf[k] : -1;
    drag = { k, partner, off: [pos[k][0] - p[0], pos[k][1] - p[1]], from: pos[k].slice(), fromP: partner >= 0 ? pos[partner].slice() : null, moved: false, id: e.pointerId, snap: snapshot() };
    const li = lv.leash.findIndex((h) => h.k === k);
    if (li >= 0) stakeEls[li].ring.classList.add("hot");
    if (lv.role[k] === "magnet" && magRing) magRing.classList.add("show");
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    nodeEls[k].c.classList.add("drag");
    if (partner >= 0) nodeEls[partner].c.classList.add("drag");
    nodeEls[k].g.parentNode.appendChild(nodeEls[k].g);
    sfx.grab();
  }
  // Cordes curtes: el punt no pot allunyar-se dels seus veïns més del que deixa la corda.
  function constrain(k, target) {
    let p = target.slice();
    const lim = [];
    const h = lv.leash.find((q) => q.k === k);
    const tie = (q) => { if (!h) return q; const d = dist(q, h.s); return d <= h.R ? q : [h.s[0] + (q[0] - h.s[0]) * h.R / d, h.s[1] + (q[1] - h.s[1]) * h.R / d]; };
    p = tie(p);
    lv.edges.forEach(([a, b], q) => {
      if (lv.shortLen[q] == null || !edgeOn[q]) return;
      if (a === k) lim.push([b, lv.shortLen[q]]); else if (b === k) lim.push([a, lv.shortLen[q]]);
    });
    if (!lim.length) return p;
    for (let it = 0; it < 6; it++) {
      for (const [nb, L] of lim) {
        const d = dist(p, pos[nb]);
        if (d > L) p = [pos[nb][0] + (p[0] - pos[nb][0]) * L / d, pos[nb][1] + (p[1] - pos[nb][1]) * L / d];
      }
      p = tie([Math.min(0.96, Math.max(0.04, p[0])), Math.min(0.96, Math.max(0.04, p[1]))]);
    }
    return lim.every(([nb, L]) => dist(p, pos[nb]) <= L * 1.002) ? p : null;
  }
  const inZone = (p) => lv.zones.some((z) => dist(p, z) < lv.zr);
  board.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = toBoard(e);
    let target = [p[0] + drag.off[0], p[1] + drag.off[1]];
    if (drag.partner >= 0) {
      let dx = target[0] - drag.from[0], dy = target[1] - drag.from[1];
      [drag.from, drag.fromP].forEach((f) => {
        dx = Math.min(0.96 - f[0], Math.max(0.04 - f[0], dx));
        dy = Math.min(0.96 - f[1], Math.max(0.04 - f[1], dy));
      });
      pos[drag.k] = [drag.from[0] + dx, drag.from[1] + dy];
      pos[drag.partner] = [drag.fromP[0] + dx, drag.fromP[1] + dy];
      drag.moved = drag.moved || Math.abs(dx) + Math.abs(dy) > 0.004;
    } else {
      target = [Math.min(0.96, Math.max(0.04, target[0])), Math.min(0.96, Math.max(0.04, target[1]))];
      const c = constrain(drag.k, target);
      if (c) pos[drag.k] = c;
      drag.moved = drag.moved || dist(pos[drag.k], drag.from) > 0.004;
    }
    zoneEls.forEach((z, q) => z.classList.toggle("hot", dist(pos[drag.k], lv.zones[q]) < lv.zr || (drag.partner >= 0 && dist(pos[drag.partner], lv.zones[q]) < lv.zr)));
    draw();
  });
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    nodeEls[d.k].c.classList.remove("drag");
    if (d.partner >= 0) nodeEls[d.partner].c.classList.remove("drag");
    zoneEls.forEach((z) => z.classList.remove("hot"));
    stakeEls.forEach((q) => q.ring.classList.remove("hot"));
    if (magRing) magRing.classList.remove("show");
    if (d.moved) {
      const blocked = inZone(pos[d.k]) || (d.partner >= 0 && inZone(pos[d.partner]));
      if (blocked) {
        pos[d.k] = d.from; if (d.partner >= 0) pos[d.partner] = d.fromP;
        sfx.locked(); flash(t("zoneBack"));
        draw(); return;
      }
      history.push(d.snap);
      moves++;
      if (lv.role[d.k] === "count") {
        countLeft[d.k] = Math.max(0, countLeft[d.k] - 1);
        if (!countLeft[d.k]) { frozen[d.k] = true; sfx.freeze(); } else sfx.drop();
      } else sfx.drop();
      kick(d.k, 0.45);
      if (d.partner >= 0) kick(d.partner, 0.45);
      postMove(d.k);
      return;
    }
    afterChange(d.k);
  }

  /* ---------- Desfer ---------- */
  function snapshot() { return { pos: pos.map((p) => p.slice()), moves, countLeft: Object.assign({}, countLeft), frozen: frozen.slice() }; }
  $("toolUndo").addEventListener("click", () => {
    if (over || busy || drag) return;
    if (!history.length) { flash(t("noUndo")); sfx.locked(); return; }
    if (!pay("undo")) return;
    const S = history.pop();
    pos = S.pos; moves = S.moves; countLeft = S.countLeft; frozen = S.frozen;
    usedTools++;
    lv.edges.forEach((_, k) => { sp[k].vx += (Math.random() - 0.5) * 0.4; sp[k].vy += (Math.random() - 0.5) * 0.4; });
    sfx.undo(); buzz(10);
    prevCross = draw();
  });

  /* ---------- Després d'un moviment: imant i intercanvi ---------- */
  const MAG_R = 0.26, MAG_PULL = 0.45, MAG_MIN = 0.1;
  function tween(from, to, ms, cb, arc) {
    if (reduce) { Object.keys(to).forEach((k) => { pos[k] = to[k].slice(); }); draw(); cb(); return; }
    const t0 = performance.now();
    const step = () => {
      const now = performance.now();
      const u = Math.max(0, Math.min(1, (now - t0) / ms)), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      Object.keys(to).forEach((k) => {
        const a = from[k], b = to[k];
        let x = a[0] + (b[0] - a[0]) * e, y = a[1] + (b[1] - a[1]) * e;
        if (arc) { const dx = b[0] - a[0], dy = b[1] - a[1], s2 = Math.sin(Math.PI * e) * arc; x += -dy * s2; y += dx * s2; }
        pos[k] = [x, y];
      });
      draw();
      if (u < 1) requestAnimationFrame(step); else cb();
    };
    requestAnimationFrame(step);
  }
  function pullTargets(m) {
    const to = {};
    pos.forEach((p, j) => {
      if (j === m || !alive[j]) return;
      const role = lv.role[j];
      if (!["", "count", "swap", "leash"].includes(role) || frozen[j]) return;
      const d = dist(p, pos[m]);
      if (d >= MAG_R || d <= MAG_MIN) return;
      const nd = Math.max(MAG_MIN, d * (1 - MAG_PULL));
      const q = [pos[m][0] + (p[0] - pos[m][0]) * nd / d, pos[m][1] + (p[1] - pos[m][1]) * nd / d];
      if (inZone(q)) return;
      const h = lv.leash.find((x) => x.k === j);
      if (h && dist(q, h.s) > h.R) return;
      const okShort = lv.edges.every(([a, b], k) => {
        if (lv.shortLen[k] == null || !edgeOn[k] || (a !== j && b !== j)) return true;
        const o = a === j ? b : a;
        return dist(q, to[o] || pos[o]) <= lv.shortLen[k];
      });
      if (okShort) to[j] = q;
    });
    return to;
  }
  function postMove(k) {
    busy = true;
    const done = () => { busy = false; afterChange(k); };
    const afterPull = () => {
      const S = lv.swap;
      const left = crossAll(lv, pos, edgeOn).count;
      if (S && left > 0 && moves % S.every === 0 && alive[S.a] && alive[S.b] && moves < maxMoves) {
        const from = { [S.a]: pos[S.a].slice(), [S.b]: pos[S.b].slice() };
        const to = { [S.a]: pos[S.b].slice(), [S.b]: pos[S.a].slice() };
        sfx.swap(); flash(t("swapNow"));
        setTimeout(() => tween(from, to, 450, () => { kick(S.a, 0.6); kick(S.b, 0.6); done(); }, 0.35), 180);
      } else done();
    };
    if (lv.role[k] === "magnet") {
      const to = pullTargets(k);
      if (!Object.keys(to).length) return afterPull();
      const from = {}; Object.keys(to).forEach((j) => { from[j] = pos[j].slice(); });
      sfx.magnet(); buzz(15);
      if (magRing) { magRing.classList.add("show"); setTimeout(() => magRing.classList.remove("show"), 500); }
      tween(from, to, 320, () => { Object.keys(to).forEach((j) => kick(+j, 0.35)); afterPull(); });
    } else afterPull();
  }
  board.addEventListener("pointerup", onUp);
  board.addEventListener("pointercancel", onUp);

  /* ---------- Punt mòbil: gira sol i el joc comprova els creuaments a cada moment ---------- */
  let moverToken = 0;
  function runMovers() {
    const my = ++moverToken;
    if (!lv.movers.length) return;
    let tt = 0, last = performance.now();
    const step = () => {
      if (my !== moverToken) return;
      const now = performance.now();
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
      if (current === "s-game" && !over && $("tutBox").hidden) {
        tt += dt;
        lv.movers.forEach((M) => { const a = M.phase + tt * M.speed; pos[M.k] = [M.c[0] + M.R * Math.cos(a), M.c[1] + M.R * Math.sin(a)]; });
        const left = draw();
        prevCross = left;
        if (left === 0 && moves > 0 && !drag && !busy) win();
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------- Cordes que reboten: el centre de cada corda segueix els punts amb una molla ---------- */
  const SPR_K = 520, SPR_C = 30, SPR_MAX = 0.04;   // més rígides: poc rebot i tornen rectes de pressa
  function renderEdge(k) {
    const E = edgeEls[k]; if (!E) return;
    const [a, b] = lv.edges[k];
    const x1 = pos[a][0], y1 = pos[a][1], x2 = pos[b][0], y2 = pos[b][1];
    const s0 = sp[k] || { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
    const cx = 2 * s0.x - (x1 + x2) / 2, cy = 2 * s0.y - (y1 + y2) / 2;
    const d = "M" + (x1 * 1000).toFixed(1) + " " + (y1 * 1000).toFixed(1) + "Q" + (cx * 1000).toFixed(1) + " " + (cy * 1000).toFixed(1) + " " + (x2 * 1000).toFixed(1) + " " + (y2 * 1000).toFixed(1);
    E.vis.setAttribute("d", d); E.glow.setAttribute("d", d); if (E.core) E.core.setAttribute("d", d);
  }
  function kick(k, power) {
    if (reduce || !lv) return;
    lv.edges.forEach(([a, b], q) => {
      if (a !== k && b !== k) return;
      const dx = pos[b][0] - pos[a][0], dy = pos[b][1] - pos[a][1], L = Math.hypot(dx, dy) || 1;
      const sgn = Math.random() < 0.5 ? -1 : 1, m = power * (0.6 + Math.random() * 0.6) * sgn;
      sp[q].vx += -dy / L * m; sp[q].vy += dx / L * m;
    });
  }
  function springLoop() {
    let last = performance.now();
    const step = () => {
      const now = performance.now();
      const dt = Math.max(0, Math.min(1 / 30, (now - last) / 1000)); last = now;
      if (current === "s-game" && lv && sp.length === lv.edges.length && edgeEls.length === lv.edges.length) {
        let moving = false;
        lv.edges.forEach(([a, b], k) => {
          const s0 = sp[k];
          const tx = (pos[a][0] + pos[b][0]) / 2, ty = (pos[a][1] + pos[b][1]) / 2;
          if (reduce) { s0.x = tx; s0.y = ty; s0.vx = s0.vy = 0; return; }
          for (let sub = 0; sub < 2; sub++) {
            const h = dt / 2;
            s0.vx += (SPR_K * (tx - s0.x) - SPR_C * s0.vx) * h;
            s0.vy += (SPR_K * (ty - s0.y) - SPR_C * s0.vy) * h;
            s0.x += s0.vx * h; s0.y += s0.vy * h;
          }
          const ox = s0.x - tx, oy = s0.y - ty, od = Math.hypot(ox, oy);
          if (od > SPR_MAX) { s0.x = tx + ox / od * SPR_MAX; s0.y = ty + oy / od * SPR_MAX; }
          if (od > 0.0004 || Math.abs(s0.vx) + Math.abs(s0.vy) > 0.004) moving = true;
          else { s0.x = tx; s0.y = ty; s0.vx = s0.vy = 0; }
        });
        if (moving || springWasMoving) lv.edges.forEach((_, k) => renderEdge(k));
        springWasMoving = moving;
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  let springWasMoving = false;

  /* ---------- Tutorial: una mà que arrossega el primer punt ---------- */
  let handOn = false, handToken = 0, handLayer = null;
  function stopHand() {
    handToken++;
    if (handLayer) { handLayer.remove(); handLayer = null; }
    if (handOn) { handOn = false; updateHint(); }
  }
  function startHand() {
    if (reduce) return;
    // el punt que, mogut a la seva posició final, deixa menys creuaments
    let bestK = -1, bestC = 1e9;
    lv.nodes.forEach((p, k) => {
      if (lv.role[k]) return;
      const P = pos.map((q) => q.slice()); P[k] = lv.nodes[k].slice();
      const c = crossAll(lv, P).count;
      if (c < bestC && dist(pos[k], lv.nodes[k]) > 0.08) { bestC = c; bestK = k; }
    });
    if (bestK < 0) return;
    const k = bestK, A = pos[k].slice(), B = lv.nodes[k].slice();
    handOn = true; updateHint();
    const my = ++handToken;
    handLayer = mk("g", null, board);
    const trail = mk("path", { class: "handtrail", d: "M" + A[0] * 1000 + " " + A[1] * 1000 + "L" + B[0] * 1000 + " " + B[1] * 1000 }, handLayer);
    const ghost = mk("circle", { class: "ghostdot", r: nodeR + 4 }, handLayer);
    const ripple = mk("circle", { class: "ripple", r: nodeR }, handLayer);
    const hand = mk("g", { class: "hand" }, handLayer);
    hand.innerHTML =
      '<rect class="skin" x="-11" y="-4" width="22" height="70" rx="11"/>' +
      '<rect class="skin" x="10" y="34" width="20" height="48" rx="10"/>' +
      '<rect class="skin" x="28" y="42" width="19" height="42" rx="9.5"/>' +
      '<rect class="skin" x="44" y="52" width="17" height="34" rx="8.5"/>' +
      '<path class="skin" d="M-11 50 C-30 46 -44 58 -38 70 C-30 84 -14 96 -2 112 L50 112 C62 100 64 86 62 70 L-11 62 Z"/>' +
      '<rect class="nail" x="-6" y="0" width="12" height="14" rx="5"/>';
    const t0 = performance.now(), CYCLE = 2600;
    const step = () => {
      if (my !== handToken || !handLayer) return;
      const tt = (Math.max(0, performance.now() - t0) % CYCLE) / CYCLE;
      let x, y, press = 0, show = 1;
      if (tt < 0.12) { x = A[0]; y = A[1]; show = tt / 0.12; }
      else if (tt < 0.22) { x = A[0]; y = A[1]; press = (tt - 0.12) / 0.1; }
      else if (tt < 0.72) { const u = (tt - 0.22) / 0.5, e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; x = A[0] + (B[0] - A[0]) * e; y = A[1] + (B[1] - A[1]) * e; press = 1; }
      else if (tt < 0.82) { x = B[0]; y = B[1]; press = 1 - (tt - 0.72) / 0.1; }
      else { x = B[0]; y = B[1]; show = 1 - (tt - 0.82) / 0.18; }
      const X = x * 1000, Y = y * 1000;
      hand.setAttribute("transform", "translate(" + (X + 6) + " " + (Y + 8) + ") rotate(-18) scale(" + (1.5 - press * 0.12) + ")");
      hand.style.opacity = show;
      ghost.setAttribute("cx", X); ghost.setAttribute("cy", Y); ghost.style.opacity = press * show;
      trail.style.opacity = 0.6 * show;
      const rp = tt >= 0.12 && tt < 0.3 ? (tt - 0.12) / 0.18 : 0;
      ripple.setAttribute("cx", A[0] * 1000); ripple.setAttribute("cy", A[1] * 1000);
      ripple.setAttribute("r", nodeR + rp * 50); ripple.style.opacity = rp ? (1 - rp) * 0.8 : 0;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  board.addEventListener("pointerdown", () => { if (handOn) stopHand(); }, true);

  /* ---------- Música de fons: acords suaus i notes soltes, generats en directe ---------- */
  let musicTimer = null, musicGain = null, musicNext = 0, musicStep = 0, userTouched = false;
  const CHORDS = [[146.83, 220, 293.66, 369.99], [123.47, 185, 246.94, 293.66], [98, 146.83, 196, 246.94], [110, 164.81, 220, 277.18]];
  const PENTA = [587.33, 659.25, 739.99, 880, 987.77, 1174.66];
  function mNote(freq, at, dur, vol, type) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at + Math.min(1.4, dur * 0.3));
    g.gain.linearRampToValueAtTime(0, at + dur);
    o.connect(g).connect(musicGain); o.start(at); o.stop(at + dur + 0.05);
  }
  function musicSched() {
    if (!musicGain) return;
    while (musicNext < ac.currentTime + 1.2) {
      const bar = Math.floor(musicStep / 8) % 4, beat = musicStep % 8;
      if (beat === 0) CHORDS[bar].forEach((f, q) => mNote(f, musicNext, 4.6, q === 0 ? 0.05 : 0.03, "sine"));
      if (Math.random() < 0.42) mNote(PENTA[Math.floor(Math.random() * PENTA.length)], musicNext, 1.2, 0.016, "triangle");
      musicNext += 0.5; musicStep++;
    }
  }
  function musicStart() {
    if (!save.music || musicTimer || !userTouched || document.hidden) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      musicGain = ac.createGain();
      musicGain.gain.setValueAtTime(0, ac.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.9, ac.currentTime + 2.5);
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500;
      musicGain.connect(lp); lp.connect(ac.destination);
      musicNext = ac.currentTime + 0.1;
      musicTimer = setInterval(musicSched, 200);
      musicSched();
    } catch (e) {}
  }
  function musicStop() {
    clearInterval(musicTimer); musicTimer = null;
    if (musicGain) {
      const g = musicGain; musicGain = null;
      try { g.gain.cancelScheduledValues(ac.currentTime); g.gain.setTargetAtTime(0, ac.currentTime, 0.25); setTimeout(() => g.disconnect(), 2500); } catch (e) {}
    }
  }
  document.addEventListener("pointerdown", () => { if (!userTouched) { userTouched = true; musicStart(); } }, true);
  document.addEventListener("visibilitychange", () => { if (document.hidden) musicStop(); else musicStart(); });

  /* ---------- Sensacions: cada creuament desfet sona més agut ---------- */
  let prevCross = 0, combo = 0, lastNode = null;
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function sparks(p, count, color) {
    if (reduce || !fxLayer) return;
    const x = p[0] * 1000, y = p[1] * 1000;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.5, d = 60 + Math.random() * 90;
      const c = mk("circle", { class: "spark", cx: x, cy: y, r: 6 + Math.random() * 6 }, fxLayer);
      c.style.setProperty("--dx", Math.cos(a) * d + "px");
      c.style.setProperty("--dy", Math.sin(a) * d + "px");
      if (color) c.style.fill = color;
      setTimeout(() => c.remove(), 700);
    }
  }
  function floater(p, txt) {
    if (!fxLayer) return;
    const e = mk("text", { class: "floater", x: p[0] * 1000, y: p[1] * 1000 - 50 }, fxLayer);
    e.textContent = txt;
    setTimeout(() => e.remove(), 950);
  }
  function afterChange(k) {
    if (k != null) lastNode = k;

    } else if (left > prevCross) {

    }

  // Confeti
  const cfx = $("confetti");
  let parts = [], cfxOn = false;
  function confetti(x, y, n, spread) {
    if (reduce) return;
    const dpr = window.devicePixelRatio || 1;
    cfx.width = innerWidth * dpr; cfx.height = innerHeight * dpr;
    const cols = ["#3fa3ff", "#7ef0c4", "#eef7ff", "#ff9a62", "#bfe3ff", skin().node];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * (spread || 2.2), v = 6 + Math.random() * 9;
      parts.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * v * dpr, vy: Math.sin(a) * v * dpr, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.4,
        w: (5 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr, c: cols[i % cols.length], life: 0 });
    }
    if (!cfxOn) { cfxOn = true; requestAnimationFrame(cfxLoop); }
  }
  function cfxLoop() {
    const g = cfx.getContext("2d");
    g.clearRect(0, 0, cfx.width, cfx.height);
    const dpr = window.devicePixelRatio || 1;
    parts = parts.filter((p) => p.y < cfx.height + 40 && p.life < 240);
    parts.forEach((p) => {
      p.life++; p.vy += 0.28 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      g.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.life * 0.12)), p.w, p.h * Math.abs(Math.cos(p.life * 0.12)) + 1);
      g.restore();
    });
    if (parts.length) requestAnimationFrame(cfxLoop); else { cfxOn = false; g.clearRect(0, 0, cfx.width, cfx.height); }
  }
  function confettiFrom(el, n) {
    const r = el.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height * 0.45, n);
  }

  // Ona verda des de l'últim punt mogut fins a l'altra punta

  /* ---------- Final de nivell ---------- */
  let endAction = null, lostState = false;
  function countUp(el, to, delay) {
    el.innerHTML = PEARL + "+0";
    setTimeout(() => {
      const t0 = performance.now(), dur = Math.min(900, 300 + to * 15);
      let last = -1;
      const step = () => {
        const now = performance.now();
        const k = Math.max(0, Math.min(1, (now - t0) / dur));
        const v = Math.round(to * (1 - Math.pow(1 - k, 3)));
        if (v !== last) { el.innerHTML = PEARL + "+" + v; if (v % 2 === 0) sfx.tick(); last = v; }
        if (k < 1) requestAnimationFrame(step);
        else { sfx.coin(); renderCounters(true); }
      };
      requestAnimationFrame(step);
    }, delay);
  }
  function animateStars(n) {
    $("endStars").innerHTML = [0, 1, 2].map((i) => '<span class="s' + (i < n ? "" : " off") + '" style="animation-delay:' + (0.15 + i * 0.3) + 's">★</span>').join("");
    for (let i = 0; i < n; i++) setTimeout(() => { sfx.star(i); buzz(15); }, 150 + i * 300);
  }
  function showEnd(kind, info) {
    lostState = kind === "lose";
    $("endDialog").classList.toggle("lost", kind === "lose");

    $("endReward").hidden = true;
    $("btnEndBuy").hidden = true;
    $("btnEndDouble").hidden = true;
    const ex = $("endExtra"); ex.hidden = true;
    const st = $("endStreak"); st.hidden = true;
    if (kind === "win") {
      animateStars(info.stars);
      $("endTitle").textContent = t(info.under ? "titleUnder" : "title" + info.stars);
      $("endText").textContent = (cur === DAILY ? t("dailyWinText", { m: moves }) : t("winText", { n: cur + 1, m: moves })) + (info.stars < 3 ? " " + t("winTip", { p: lv.par }) : "");
      if (info.reward > 0) { $("endReward").hidden = false; countUp($("endReward"), info.reward, 150 + info.stars * 300); }
      // Vídeo per duplicar les perles guanyades
      lastReward = info.reward;
      const dbl = $("btnEndDouble");
      dbl.hidden = !(info.reward > 0);
      dbl.disabled = false;
      dbl.innerHTML = '<span class="play">' + PLAY_SVG + "</span><span>" + t("doublePearls") + "</span><span style=\"display:inline-flex;align-items:center;gap:4px\">" + PEARL + "+" + info.reward + "</span>";
      if (info.streakBonus > 0) { st.hidden = false; st.className = "streak-line"; st.innerHTML = FLAME + t("streakBonus", { n: save.winStreak }) + " · " + PEARL + "+" + info.streakBonus; }
      if (cur === DAILY) {
        $("btnEndMain").textContent = t("menu");

        else if (!last && !nextOpen) { ex.hidden = false; ex.textContent = t("needMore", { n: cur + 2, s: reqStars(cur + 1), h: totalStars() }); }
        $("btnEndMain").textContent = last ? t("menu") : nextOpen ? t("next") : t("retry");
        endAction = () => { if (last) go("s-menu"); else if (nextOpen) startLevel(cur + 1); else startLevel(cur); };
      }
    } else {
      $("endTitle").textContent = t("failTitle");

      if (save.winStreak >= 2) { st.hidden = false; st.className = "streak-line warn"; st.innerHTML = FLAME + t("streakLost", { n: save.winStreak }); }
      $("btnEndMain").textContent = t("retry");

    $("endBox").hidden = false;
    $("btnEndMain").focus();
  }
  function breakStreak() { if (save.winStreak) { save.winStreak = 0; persist(); renderCounters(); } }
  function win() {
    over = true; setMode(null);
    $("toolUndo").disabled = true;
    celebrate();
    const mid = lv.par + Math.ceil((lv.max - lv.par) / 2);
    const stars = moves <= lv.par ? 3 : moves <= mid ? 2 : 1;
    save.winStreak = (save.winStreak || 0) + 1;
    const streakBonus = Math.min(save.winStreak - 1, 5) * 2;   // de +2 a +10 perles
    let reward = 0, newly = [];
    if (cur === DAILY) {
      reward = save.dailyDone === dayKey() ? 2 : 30;
      save.dailyDone = dayKey();
      bumpMission("daily", 1);
    } else {
      const prevStars = save.stars[cur];
      const before = LEVELS.map((_, k) => isUnlocked(k));
      // Perles: primera vegada 10 · cada estrella nova +4 · cada moviment per sota de l'objectiu +3 (només si millores)
      reward = prevStars === 0 ? [10, 18, 30][lv.diff || 0] : 1;
      if (stars > prevStars) reward += (4 + 2 * (lv.diff || 0)) * (stars - prevStars);
      const under = Math.max(0, lv.par - moves);
      const prevUnder = save.best[cur] == null ? 0 : Math.max(0, lv.par - save.best[cur]);
      reward += 3 * Math.max(0, under - prevUnder);
      save.best[cur] = Math.min(save.best[cur] == null ? Infinity : save.best[cur], moves);
      if (stars > prevStars) save.stars[cur] = stars;
      newly = LEVELS.map((_, k) => k).filter((k) => !before[k] && isUnlocked(k));

    reward += streakBonus;
    bumpMission("win", 1);

    bumpMission("streak", save.winStreak, true);
    save.pearls += reward;
    persist();
    sfx.win();

  function skinPreview(k) {

    return '<svg class="pv" viewBox="0 0 100 100" aria-hidden="true">' +
      E.map(([a, b]) => '<line x1="' + P[a][0] + '" y1="' + P[a][1] + '" x2="' + P[b][0] + '" y2="' + P[b][1] + '" style="stroke:' + k.rope + ';stroke-width:4;stroke-linecap:round"/>').join("") +
      P.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="7.5" style="fill:' + k.node + ';stroke:' + k.ring + ';stroke-width:2.5"/>').join("") + "</svg>";
  }
  function renderSkins() {
    renderCounters();
    const box = $("skinGrid"); box.innerHTML = "";
    SKINS.forEach((k) => {
      const owned = save.owned.includes(k.id), on = save.skin === k.id;
      const c = document.createElement("div");
      c.className = "skin" + (on ? " on" : "");
      c.innerHTML = skinPreview(k) + '<span class="nm"></span><button></button>';
      c.querySelector(".nm").textContent = t("sk_" + k.id);
      const b = c.querySelector("button");
      if (on) { b.textContent = t("equipped"); b.disabled = true; }
      else if (owned) b.textContent = t("equip");
      else { b.className = "buy" + (save.pearls < k.price ? " poor" : ""); b.innerHTML = PEARL + k.price; }
      b.addEventListener("click", () => {
        if (!owned) {
          if (save.pearls < k.price) { sfx.locked(); b.animate([{ transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], 220); return; }
          save.pearls -= k.price; save.owned.push(k.id);
          sfx.gift(); confettiFrom(c, 50);
        } else sfx.grab();
        save.skin = k.id; persist(); applySkin(); renderSkins(); renderCounters(true);
      });
      box.appendChild(c);
    });
  }

  /* ---------- Premi diari ---------- */
  function showGift() {
    const gs = giftState();
    const idx = (gs.streak - 1) % 7;
    $("giftStreak").textContent = gs.streak < 2 ? t("dayN", { n: 1 }) : t("giftStreak", { n: gs.streak });
    $("giftDays").innerHTML = GIFT.map((amt, d) => {
      const cls = d < idx || (d === idx && !gs.claimable) ? " done" : d === idx ? " today" : "";
      return '<div class="day' + cls + (d === 6 ? " last" : "") + '"><span>' + t("dayN", { n: d + 1 }) + "</span>" + PEARL + "<b>" + amt + "</b></div>";
    }).join("");
    const b = $("btnGiftClaim");
    b.innerHTML = gs.claimable ? "<span>" + t("claim") + '</span><span style="display:inline-flex;align-items:center;gap:4px">' + PEARL + GIFT[idx] + "</span>" : t("giftTomorrow");
    b.onclick = () => {
      if (gs.claimable) {
        save.pearls += GIFT[idx];
        save.gift = { last: dayKey(), streak: gs.streak };
        persist(); sfx.gift(); buzz([15, 30, 15]); confettiFrom(b, 70);
        renderCounters(true); renderMenu();
      }
      $("giftBox").hidden = true;
    };
    $("giftBox").hidden = false;
  }
  $("btnGift").addEventListener("click", showGift);

  /* ---------- Cofre d'estrelles ---------- */
  $("chestCard").addEventListener("click", () => {
    if (chestsReady() <= 0) { sfx.tick(); return; }
    save.chests++;
    const jackpot = Math.random() < 0.12;
    const amt = jackpot ? 150 : 25 + Math.floor(Math.random() * 36);
    save.pearls += amt; persist();
    $("chestPic").innerHTML = chestSvg("chestpic shake");
    $("chestTitle").textContent = t("chest");
    $("chestAmount").innerHTML = "";
    $("btnChestOk").hidden = true;
    $("chestBox").hidden = false;
    sfx.grab();
    setTimeout(() => {
      const pic = $("chestPic").firstChild;
      pic.classList.remove("shake"); pic.classList.add("open");
      $("chestTitle").textContent = jackpot ? t("jackpot") : t("chestTitle");
      sfx.gift(); buzz([20, 40, 60]);
      confettiFrom(pic, jackpot ? 160 : 80);
      const el = $("chestAmount");
      const t0 = performance.now();
      const step = () => {
        const now = performance.now();
        const k = Math.max(0, Math.min(1, (now - t0) / 800));
        el.innerHTML = PEARL + "+" + Math.round(amt * (1 - Math.pow(1 - k, 3)));
        if (k < 1) { if (Math.random() < 0.5) sfx.tick(); requestAnimationFrame(step); }
        else { sfx.coin(); $("btnChestOk").hidden = false; $("btnChestOk").focus(); }
      };
      requestAnimationFrame(step);
    }, 900);
  });
  $("btnChestOk").addEventListener("click", () => { $("chestBox").hidden = true; renderMenu(); renderCounters(true); });

  /* ================= ANUNCIS =================
     A l'app (Capacitor + AdMob) mostra anuncis reals. Al navegador mostra un anunci simulat de 3 segons.
     ADS_TEST = true fa servir els anuncis de prova de Google. Posa-ho a false NOMÉS a la versió que pengis a la Play Store. */
  const ADS_TEST = true;
  const ADS = {
    appId: "ca-app-pub-8296675958228563~5110959439",
    interstitial: "ca-app-pub-8296675958228563/4592084681",
    rewarded: "ca-app-pub-8296675958228563/8611220748",
    testInterstitial: "ca-app-pub-3940256099942544/1033173712",
    testRewarded: "ca-app-pub-3940256099942544/5224354917"
  };
  const FREE_PEARLS = 40;          // perles gratis diàries amb vídeo
  const INTER_FROM = 10, INTER_EVERY = 4;   // pantalla completa: a partir del nivell 10, cada 4 nivells superats
  const PLAY_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2v9.6L10.5 6z"/></svg>';
  const Ads = (() => {
    const cap = window.Capacitor;
    const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
    const AdMob = native ? ((cap.Plugins && cap.Plugins.AdMob) || (cap.registerPlugin ? cap.registerPlugin("AdMob") : null)) : null;
    let ready = null, lastAdAt = 0;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    function init() {
      if (!AdMob) return Promise.resolve(false);
      if (!ready) ready = (async () => {
        try {
          await AdMob.initialize({ initializeForTesting: ADS_TEST });
          try {
            const ci = await AdMob.requestConsentInfo();
            if (ci && ci.isConsentFormAvailable && ci.status === "REQUIRED") await AdMob.showConsentForm();
          } catch (e) {}
          return true;
        } catch (e) { return false; }
      })();
      return ready;
    }
    function loading(on) { const el = $("adLoading"); el.textContent = t("adLoading"); el.hidden = !on; }
    function simulate() {
      return new Promise((resolve) => {
        const box = $("adSim"); $("adSimTag").textContent = t("adTest");
        let n = 3; $("adSimN").textContent = n; box.hidden = false;
        const tick = () => { n--; if (n <= 0) { box.hidden = true; resolve(true); } else { $("adSimN").textContent = n; setTimeout(tick, 1000); } };
        setTimeout(tick, 1000);
      });
    }
    async function rewarded() {
      musicStop();
      let got = false;
      try {
        if (!AdMob) { got = await simulate(); return got; }
        loading(true);
        if (!(await init())) throw new Error("init");
        let done; const finished = new Promise((r) => { done = r; });
        const hs = [];
        const on = async (ev, fn) => { try { hs.push(await AdMob.addListener(ev, fn)); } catch (e) {} };
        await on("onRewardedVideoAdReward", () => { got = true; });
        await on("onRewardedVideoAdDismissed", () => done());
        await on("onRewardedVideoAdFailedToShow", () => done());
        try {
          await AdMob.prepareRewardVideoAd({ adId: ADS_TEST ? ADS.testRewarded : ADS.rewarded, isTesting: ADS_TEST });
          loading(false);
          const item = await AdMob.showRewardVideoAd();
          if (item && (item.amount != null || item.type)) got = true;
          await Promise.race([finished, wait(1500)]);
        } finally { loading(false); hs.forEach((h) => { try { h.remove(); } catch (e) {} }); }
        if (!got) flash(t("adFail"));
        return got;
      } catch (e) { loading(false); flash(t("adFail")); return false; }
      finally { lastAdAt = Date.now(); musicStart(); }
    }
    async function interstitial() {
      if (!AdMob) return;
      if (Date.now() - lastAdAt < 60000) return;   // mai just després d'un altre anunci
      musicStop();
      try {
        if (!(await init())) return;
        await AdMob.prepareInterstitial({ adId: ADS_TEST ? ADS.testInterstitial : ADS.interstitial, isTesting: ADS_TEST });
        await Promise.race([AdMob.showInterstitial(), wait(60000)]);
      } catch (e) {}
      finally { lastAdAt = Date.now(); musicStart(); }
    }
    async function privacyOptions() {
      if (!AdMob) return;
      try { await init(); if (AdMob.showPrivacyOptionsForm) await AdMob.showPrivacyOptionsForm(); else await AdMob.showConsentForm(); } catch (e) {}
    }
    return { native, init, rewarded, interstitial, privacyOptions };
  })();
  if (Ads.native) setTimeout(() => Ads.init(), 1500);
  const PRIVACY_URL = "https://knotsgame.netlify.app";
  $("lnkPrivacy").href = PRIVACY_URL;
  $("btnAdPrivacy").hidden = !Ads.native;
  $("btnAdPrivacy").addEventListener("click", () => Ads.privacyOptions());

  // Perles gratis diàries amb vídeo
  function renderFree() {
    const b = $("btnFree");
    const can = save.freeDay !== dayKey();
    b.hidden = !can;
    b.innerHTML = '<svg class="pl" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2v9.6L10.5 6z"/></svg>' + PEARL + "+" + FREE_PEARLS;
    b.setAttribute("aria-label", t("freePearls") + " +" + FREE_PEARLS);
  }
  $("btnFree").addEventListener("click", async () => {
    if (save.freeDay === dayKey()) return;
    const b = $("btnFree"); b.disabled = true;
    const ok = await Ads.rewarded();
    b.disabled = false;
    if (!ok) return;
    save.freeDay = dayKey(); save.pearls += FREE_PEARLS; persist();
    sfx.gift(); confettiFrom(b, 40); renderCounters(true); renderFree();
  });

  /* ================= CONFIGURACIÓ ================= */
  function applySettings() {
    $("optSound").checked = save.sound;
    $("optMusic").checked = save.music;
    $("optHighlight").checked = save.highlight;
    $("optCounter").checked = save.counter;
    board.classList.toggle("no-hl", !save.highlight);
    $("statCross").style.visibility = save.counter ? "visible" : "hidden";
  }
  $("optMusic").setAttribute("aria-label", "music");
  $("optMusic").addEventListener("change", (e) => { save.music = e.target.checked; persist(); if (save.music) { userTouched = true; musicStart(); } else musicStop(); });
  [["optSound", "sound"], ["optHighlight", "highlight"], ["optCounter", "counter"]].forEach(([id, key]) => {
    $(id).setAttribute("aria-label", key);
    $(id).addEventListener("change", (e) => { save[key] = e.target.checked; persist(); applySettings(); if (key === "sound" && save.sound) sfx.grab(); });
  });
  $("btnReset").addEventListener("click", () => { $("btnReset").hidden = true; $("resetConfirm").hidden = false; });
  $("btnResetNo").addEventListener("click", () => { $("btnReset").hidden = false; $("resetConfirm").hidden = true; });
  $("btnResetYes").addEventListener("click", () => {
    save.stars = LEVELS.map(() => 0); save.best = []; save.seen = {}; save.pearls = START_PEARLS; save.winStreak = 0; save.chests = 0; save.dailyDone = null; save.owned = ["classic"]; save.skin = "classic"; persist(); applySkin();
    $("btnReset").hidden = false; $("resetConfirm").hidden = true;
    $("btnReset").textContent = t("resetDone");
    renderCounters();
    setTimeout(() => { $("btnReset").textContent = t("reset"); }, 1800);
  });

  /* ================= ANIMACIÓ DEL MENÚ ================= */
  const hero = $("heroSvg");
  const H = {
    solved: [[150,40],[255,105],[230,235],[70,235],[45,105],[150,150]],
    tangled: [[230,235],[45,105],[150,40],[255,105],[150,150],[70,235]],
    edges: [[0,1],[1,2],[2,3],[3,4],[4,0],[5,0],[5,1],[5,2],[5,3],[5,4]]
  };
  const hEdges = H.edges.map(() => mk("line", { "stroke-width": 6, "stroke-linecap": "round" }, hero));
  const hNodes = H.solved.map(() => { const c = mk("circle", { r: 13, "stroke-width": 4 }, hero); c.style.fill = "#3fa3ff"; c.style.stroke = "#eef7ff"; return c; });
  let heroRunning = true;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function heroFrame(time) {
    let m;
    if (reduce) m = 1;
    else {
      const cyc = (time / 1000) % 6;
      m = cyc < 1.5 ? 0 : cyc < 3 ? ease((cyc - 1.5) / 1.5) : cyc < 4.5 ? 1 : 1 - ease((cyc - 4.5) / 1.5);
    }
    const p = H.solved.map((s, i) => [H.tangled[i][0] + (s[0] - H.tangled[i][0]) * m, H.tangled[i][1] + (s[1] - H.tangled[i][1]) * m]);
    const { count, bad } = countCrossings(p, H.edges);
    const sk = skin();
    H.edges.forEach(([a, b], i) => {
      const l = hEdges[i];
      l.setAttribute("x1", p[a][0]); l.setAttribute("y1", p[a][1]); l.setAttribute("x2", p[b][0]); l.setAttribute("y2", p[b][1]);
      l.style.stroke = count === 0 ? "#7ef0c4" : bad[i] ? "#ff9a62" : sk.rope;
    });
    hNodes.forEach((c, i) => { c.setAttribute("cx", p[i][0]); c.setAttribute("cy", p[i][1]); c.style.fill = sk.node; c.style.stroke = sk.ring; });
  }
  function loop(time) { if (heroRunning) heroFrame(time); if (!reduce) requestAnimationFrame(loop); }
  heroFrame(0);
  if (!reduce) requestAnimationFrame(loop);

  applySettings();
  applySkin();
  springLoop();
  ensureMissions();
  applyTexts();
  if (giftState().claimable) setTimeout(showGift, 500);
})();
</script>
